apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: mlops-l1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z postgres 5432; do echo 'waiting for postgres'; sleep 2; done
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v3.15.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        command:
        - sh
        - -c
        - |
          mkdir -p /mlflow/artifacts && \
          pip install --no-cache-dir psycopg2-binary==2.9.9 && \
          mlflow server \
            --host=0.0.0.0 \
            --port=5000 \
            --workers=1 \
            --backend-store-uri=postgresql://mlflow:mlflow@postgres.mlops-l1.svc.cluster.local:5432/mlflow \
            --default-artifact-root=file:///mlflow/artifacts
        resources:
          requests:
            cpu: "250m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "4Gi"
        volumeMounts:
        - name: mlflow-storage
          mountPath: /mlflow/artifacts
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 20
      volumes:
      - name: mlflow-storage
        persistentVolumeClaim:
          claimName: mlflow-pvc

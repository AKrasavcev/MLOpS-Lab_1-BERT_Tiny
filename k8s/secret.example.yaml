# Template only. Do not put real values here.
# Create the real Secret with:
#   kubectl -n mlops-l1 create secret generic mlflow-db \
#     --from-literal=POSTGRES_DB=mlflow \
#     --from-literal=POSTGRES_USER=mlflow \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)"
# (scripts/k8_deploy.sh does this for you if the Secret is missing.)
# Keep the password URL-safe (hex): MLflow puts it into a postgresql:// URI.
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-db
  namespace: mlops-l1
type: Opaque
stringData:
  POSTGRES_DB: mlflow
  POSTGRES_USER: mlflow
  POSTGRES_PASSWORD: <change-me>

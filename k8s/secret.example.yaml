# Templates only. Do not put real values here; real Secrets are created in the cluster
# (scripts/k8_deploy.sh creates both if they are missing). k8s/secret.yaml is git-ignored.

# 1) Postgres credentials for MLflow's backend store (used by k8s/postgres.yaml and k8s/mlflow.yaml).
#   kubectl -n mlops-l1 create secret generic mlflow-db \
#     --from-literal=POSTGRES_DB=mlflow \
#     --from-literal=POSTGRES_USER=mlflow \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)"
# Keep the password URL-safe (hex): MLflow puts it into a postgresql:// URI.
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-db
  namespace: mlops-l1
type: Opaque
stringData:
  POSTGRES_DB: mlflow
  POSTGRES_USER: mlflow
  POSTGRES_PASSWORD: <change-me>
---
# 2) How MLflow clients (the training Job) connect to the tracking server.
#   kubectl -n mlops-l1 create secret generic mlflow-credentials \
#     --from-literal=MLFLOW_TRACKING_URI=http://mlflow.mlops-l1.svc.cluster.local:5000
# If MLflow auth is enabled later, add MLFLOW_TRACKING_USERNAME / MLFLOW_TRACKING_PASSWORD here.
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-credentials
  namespace: mlops-l1
type: Opaque
stringData:
  MLFLOW_TRACKING_URI: http://mlflow.mlops-l1.svc.cluster.local:5000

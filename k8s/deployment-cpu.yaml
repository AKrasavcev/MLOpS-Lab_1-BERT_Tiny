apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-l1-bert-tiny
  namespace: mlops-l1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-l1-bert-tiny
  template:
    metadata:
      labels:
        app: mlops-l1-bert-tiny
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: api
          # Replace with your Artifact Registry or local image
          image: ghcr.io/akrasavcev/bert-tiny:sha-abf54914ef94
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: mlops-l1-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
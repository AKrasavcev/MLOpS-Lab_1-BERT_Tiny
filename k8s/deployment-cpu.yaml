apiVersion: v1
kind: Service
metadata:
  name: mlops-l1-bert-tiny
  namespace: mlops-l1
spec:
  selector:
    app: mlops-l1-bert-tiny
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-l1-bert-tiny
  namespace: mlops-l1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlops-l1-bert-tiny
  template:
    metadata:
      labels:
        app: mlops-l1-bert-tiny
    spec:
      containers:
        - name: api
          image: ghcr.io/akrasavcev/bert-tiny:sha-1c07b07ef6fa
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mlops-l1-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
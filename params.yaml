train:
  # Dataset batch size and maximum sequence length
  max_length: 128

  # Training Duration and per device Batch Size
  epochs: 1
  train_batch_size: 8
  eval_batch_size: 8

  # Learning Rate & Scheduler
  learning_rate: 2e-5
  lr_scheduler_type: linear   # linear, cosine, constant, cosine_with_warnmup

  # Optimizer
  optimizer: adamw_torch      # adamw_torch, adamw_torch_fused, sgd, adafactor, 
  weight_decay: 0.01

  seed: 42

  # MLflow step charts: train loss every logging_steps, eval curve every eval_steps
  logging_steps: 20
  eval_steps: 100

download:
  dataset_name: glue
  dataset_config: sst2
  
prepare:
  dataset_size: 10000
  test_size: 0.2
  seed: 42

hpo:
  n_trials: 5
  seed: 42
  metric: eval_f1             # maximized
  search_space:               # list -> categorical, {low, high, log} -> float
    learning_rate: {low: 1.0e-5, high: 5.0e-4, log: true}
    train_batch_size: [8, 16, 32]
    weight_decay: {low: 0.0, high: 0.1}
    optimizer: [adamw_torch, adamw_torch_fused, sgd, adafactor]
    lr_scheduler_type: [linear, cosine, constant]

# CD quality gate (scripts/quality_gate.py): the model is registered and deployed only if
# metric >= min_value on the test set. Override per run: CD workflow_dispatch input `min_value`.
gate:
  metric: eval_f1
  min_value: 0.70

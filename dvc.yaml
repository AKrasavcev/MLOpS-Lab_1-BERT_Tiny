stages:
  prepare:
    cmd: python src/prepare_dataset.py
    deps:
    - src/prepare_dataset.py
    - data/raw_dataset.csv
    params:
    - params.yaml:
    outs:
    - data/train.csv
    - data/test.csv

  train:
    cmd: python src/train_bert_tiny.py
    deps:
    - data/train.csv
    - data/test.csv
    - src/train_bert_tiny.py
    params:
    - params.yaml:
    outs:
    - model/model
    - model/run_id.txt:
        cache: false

  evaluate:
    cmd: python src/evaluate_model.py
    deps:
    - data/test.csv
    - model/model
    - model/run_id.txt
    - src/evaluate_model.py
    outs:
    - model/metrics.json:
        cache: false
